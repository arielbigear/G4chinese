<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字词探险队 · 四年级</title><meta name="description" content="每次十个字词，翻卡认读、拼音闯关、手写练习，轻松积累。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23394ed8'/%3E%3Ctext x='20' y='29' text-anchor='middle' fill='white' font-size='27'%3E字%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><b>字</b><span>字词探险队<small>四年级 · 一点一点，变得熟练</small></span></a><div class="star">✦ <span id="stars">0</span> 颗探索星</div></header><main><aside><div class="aside-title">我的探险地图 <span>01</span></div><h1>今天，认识<br>十个新朋友。</h1><p class="muted">不倒计时，按自己的节奏来。</p><label for="type">学习范围</label><select id="type"><option value="字">生字</option><option value="词">词语</option><option value="错">待复习</option></select><label for="group">选择一小组</label><select id="group"></select><div id="preview" class="preview" aria-label="点击字词开始全套练习"></div><p class="hint jump-hint">点击任意字词，开始它的全套练习。</p><div class="aside-bottom"><strong id="total"></strong><p>词表已全部收录。<br>多音字按这份词表的读音练习。</p></div></aside><section class="workspace"><div class="section-heading"><div><span class="eyebrow">每天一小步</span><h2>字词练习站</h2></div><button id="review" class="subtle">待复习 <span id="reviewCount">0</span></button></div><div id="journey" class="journey" hidden><strong id="journeyText"></strong><button id="backGroup" class="subtle">返回本组</button></div><nav aria-label="练习模式"><button data-mode="flash">速记闪卡</button><button data-mode="card" class="active">认读卡片</button><button data-mode="quiz">拼音闯关</button><button data-mode="reverse">字词寻宝</button><button data-mode="write">手写练习</button></nav><div id="flashTools" class="flash-tools" hidden><label>卡片范围<select id="flashScope"><option value="group">当前小组</option><option value="all">当前范围全部卡片</option></select></label><label>卡片正面<select id="flashFront"><option value="word">先看字词</option><option value="pinyin">先看拼音</option></select></label><button id="shuffleFlash" class="subtle">⇄ 打乱顺序</button></div><div class="game-top"><span id="modeLabel">先读一读，再翻开看看</span><strong id="position"></strong></div><div class="progress"><div id="bar"></div></div><div id="game"></div><div id="feedback" role="status" aria-live="polite"></div><div id="actions" class="actions"></div><footer><span>✧ 答错也没关系，再认识它一次。</span><span id="saved">进度仅保存在这台设备</span></footer></section></main><script src="data.js"></script><script src="app.js"></script></body></html>
